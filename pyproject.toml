[project]
name = "beatbot"
version = "0.1.3"
description = "BeatBot CLI — local audio feature extraction for cloud cue-point prediction"
authors = [
    {name = "Romanos Chiliarchopoulos",email = "romanoshiliarhopoulos@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"

# ── CLI dependencies (installed by default) ───────────────────────────────────
dependencies = [
    "numpy>=1.26.0,<2.4.0",
    "librosa>=0.11.0,<0.12.0",
    "scipy>=1.11.0",
    "tqdm>=4.67.3,<5.0.0",
]

# ── Optional: dev / server extras ────────────────────────────────────────────
[project.optional-dependencies]
daemon = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "wsproto>=1.2.0",
    "yt-dlp>=2024.0.0",
]
server = [
    "pandas>=2.2.0,<3.0.0",
    "lightgbm>=4.6.0,<5.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "firebase-admin>=6.5.0,<7.0.0",
]
dev = [
    "pandas>=2.2.0,<3.0.0",
    "lightgbm>=4.6.0,<5.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "firebase-admin>=6.5.0,<7.0.0",
    "yt-dlp>=2024.0.0",
    "ipywidgets>=8.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "plotly>=5.0.0",
    "streamlit>=1.30.0",
]

# ── CLI entry point: installs `beatbot` command ───────────────────────────────
[project.scripts]
beatbot = "beatbot.cli:main"

# ── Poetry package discovery ──────────────────────────────────────────────────
[tool.poetry]
packages = [{include = "beatbot"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
